name: Construire les installateurs de bureau

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Construire l’installateur Windows
        run: pnpm run dist:win
      - name: Publier l’artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: event-futures-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Construire l’image disque macOS
        run: pnpm run dist:mac:${{ matrix.arch }}
      - name: Publier l’artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: event-futures-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer tous les installateurs
        uses: actions/download-artifact@v4
        with:
          path: installateurs
          pattern: event-futures-*
          merge-multiple: true
      - name: Publier les fichiers sur la page des versions
        uses: softprops/action-gh-release@v2
        with:
          files: installateurs/*
          body: |
            ## Télécharger Event Futures

            Choisissez l’installateur correspondant à votre ordinateur. Sur macOS, l’application doit être signée et notariée pour une ouverture directe sans avertissement Gatekeeper.

            Les clés MEXC se configurent séparément sur chaque appareil et ne sont pas incluses dans ces fichiers.

name: Construire les installateurs de bureau

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Construire l’installateur Windows
        run: pnpm run dist:win
      - name: Vérifier l’application Windows empaquetée
        shell: pwsh
        run: '& ".\release\win-unpacked\Event Futures.exe" --smoke-test'
      - name: Publier l’artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: event-futures-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Construire l’image disque macOS
        run: pnpm run dist:mac:${{ matrix.arch }}
      - name: Vérifier l’application dans l’image disque macOS
        shell: bash
        run: |
          set -euo pipefail
          dmg="release/Event-Futures-2.0.0-${{ matrix.arch }}.dmg"
          test -s "$dmg"
          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT
          "$mount_point/Event Futures.app/Contents/MacOS/Event Futures" --smoke-test
      - name: Publier l’artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: event-futures-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer tous les installateurs
        uses: actions/download-artifact@v4
        with:
          path: installateurs
          pattern: event-futures-*
          merge-multiple: true
      - name: Récupérer les notes de version
        uses: actions/checkout@v4
      - name: Joindre les installateurs à la version brouillon
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: installateurs/*
          overwrite_files: true
          body_path: RELEASE_NOTES_V2.0.0.md

      - name: Vérifier les trois installateurs et publier
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace(/^refs\/tags\//, '') : '';
            if (tag !== 'v2.0.0') throw new Error(`Tag inattendu: ${tag || '(vide)'}.`);
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const release = releases.data.find(item => item.tag_name === tag && item.draft);
            if (!release) throw new Error(`Brouillon introuvable pour ${tag}.`);
            const required = [
              `Event-Futures-Setup-${tag.replace(/^v/, '')}-x64.exe`,
              `Event-Futures-${tag.replace(/^v/, '')}-arm64.dmg`,
              `Event-Futures-${tag.replace(/^v/, '')}-x64.dmg`
            ];
            const missing = required.filter(name => !release.assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0 && asset.digest));
            if (missing.length) throw new Error(`Publication suspendue; installateurs absents ou non vérifiés: ${missing.join(', ')}`);
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
